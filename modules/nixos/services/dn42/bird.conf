router id OWNIP;

protocol device device_all {
  scan time 10;
}

function is_self_net() -> bool {
  return net ~ OWNNETSET;
}

function is_self_net_v6() -> bool {
  return net ~ OWNNETSETv6;
}

function is_valid_network() -> bool {
  return net ~ [
    172.20.0.0/14{21,29}, # dn42
    172.20.0.0/24{28,32}, # dn42 Anycast
    172.21.0.0/24{28,32}, # dn42 Anycast
    172.22.0.0/24{28,32}, # dn42 Anycast
    172.23.0.0/24{28,32}, # dn42 Anycast
    172.31.0.0/16+,       # ChaosVPN
    10.100.0.0/14+,       # ChaosVPN
    10.127.0.0/16+,       # neonetwork
    10.0.0.0/8{15,24}     # Freifunk.net
  ];
}

function is_valid_network_v6() -> bool {
  return net ~ [
    fd00::/8{44,64} # ULA address space as per RFC 4193
  ];
}

# The ROAs, from stayrtr (lib/dn42-node.nix); empty on a node without it.
roa4 table roa_v4;
roa6 table roa_v6;

# Learned routes leave from this node's own address. The aggregates below
# are only announced, and the node's addresses are on the dummy interface.
protocol kernel kernel4 {
  scan time 20;
  ipv4 {
    import none;
    export filter {
      if source ~ [RTS_STATIC, RTS_DEVICE] then reject;
      krt_prefsrc = OWNIP;
      accept;
    };
  };
}

protocol kernel kernel6 {
  scan time 20;
  ipv6 {
    import none;
    export filter {
      if source ~ [RTS_STATIC, RTS_DEVICE] then reject;
      krt_prefsrc = OWNIPv6;
      accept;
    };
  };
}

protocol static static4 {
  route OWNNET reject;
  ipv4 {
    import all;
    export none;
  };
}

protocol static static6 {
  route OWNNETv6 reject;
  ipv6 {
    import all;
    export none;
  };
}

# This node's addresses, announced to the other nodes.
protocol direct direct_dn42 {
  interface "dn42";
  ipv4;
  ipv6;
}

# What a peer may send: DN42's networks but ours, each with a valid ROA.
function ebgp_valid() -> bool {
  if !is_valid_network() || is_self_net() then return false;
  if roa_check(roa_v4, net, bgp_path.last) != ROA_VALID then {
    print "[dn42] ROA check failed for ", net, " ASN ", bgp_path.last;
    return false;
  }
  return true;
}

function ebgp_valid_v6() -> bool {
  if !is_valid_network_v6() || is_self_net_v6() then return false;
  if roa_check(roa_v6, net, bgp_path.last) != ROA_VALID then {
    print "[dn42] ROA check failed for ", net, " ASN ", bgp_path.last;
    return false;
  }
  return true;
}

# Of a network's paths of one length, those from this node's region, by the
# community (64511, <region>) its origin sets, are the nearer: anycast
# networks, burble.dn42's among them, are reached where they are nearest.
# They have the lower MED, which the nodes compare across neighbours (`med
# metric`) before an eBGP route wins over iBGP ones; the other nodes take it
# over, and it's zeroed for the peers. Without a region (a VM), all are 1.
function ebgp_med() {
  if (64511, OWNREGION) ~ bgp_community then bgp_med = 0;
  else bgp_med = 1;
}

# Each channel keeps what the peer sends (`import table`): only then does
# BIRD run the import filter again when the ROA tables change. A session
# with `regions` (lib/dn42-node.nix) gives its channels an import filter of
# their own, after ebgp_valid and ebgp_med.
template bgp ebgp_peer {
  local as OWNAS;
  path metric on;
  med metric on;
  enable extended messages on;

  ipv4 {
    import table on;
    extended next hop on;
    import filter {
      if !ebgp_valid() then reject;
      ebgp_med();
      accept;
    };
    export filter {
      if is_valid_network() && source ~ [RTS_STATIC, RTS_BGP] then accept;
      else reject;
    };
    import limit 9000 action block;
  };

  ipv6 {
    import table on;
    import filter {
      if !ebgp_valid_v6() then reject;
      ebgp_med();
      accept;
    };
    export filter {
      if is_valid_network_v6() && source ~ [RTS_STATIC, RTS_BGP] then accept;
      else reject;
    };
    import limit 9000 action block;
  };
}

# The other nodes: everything learned, and each node's own addresses. A
# route without a MED, from a node on a configuration before ebgp_med, is
# not taken as from this region.
template bgp ibgp_node {
  local as OWNAS;
  direct;
  med metric on;
  enable extended messages on;

  ipv4 {
    next hop self;
    extended next hop on;
    import filter {
      if !defined(bgp_med) then bgp_med = 1;
      accept;
    };
    export where source ~ [RTS_BGP, RTS_DEVICE];
  };

  ipv6 {
    next hop self;
    import filter {
      if !defined(bgp_med) then bgp_med = 1;
      accept;
    };
    export where source ~ [RTS_BGP, RTS_DEVICE];
  };
}
